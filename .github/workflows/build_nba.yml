name: Build NBA 2025-26 Movie

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Download and Stitch NBA Moments
        run: python build_nba_movie.py

      - name: Upload Finished Movie as Downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-nba
          name: "2025-2026 NBA Most Impactful Moments (Full Compilation)"
          files: NBA_2025_2026_Impactful_Moments.mp4
